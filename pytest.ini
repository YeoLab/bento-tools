[tool:pytest]
# Test discovery and execution
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Log levels for specific modules
log_cli_loggers = 
    tests.test_measure_optimized = INFO
    bento.experimental.points._measure_optimized = INFO
    bento.experimental.points._measure = INFO

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    performance: marks tests as performance tests
    integration: marks tests as integration tests
    benchmark: marks tests as benchmark tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:bento.*

# Test output and benchmark configuration
addopts = 
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --verbose
    # Benchmark configuration
    --benchmark-autosave
    --benchmark-sort=mean
    --benchmark-min-rounds=5
    --benchmark-warmup=auto
    --benchmark-warmup-iterations=1

# Coverage (if pytest-cov is installed)
# addopts = --cov=bento --cov-report=term-missing --cov-report=html

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto

# Minimum version requirements
minversion = 6.0 