# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python Package Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os : [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11']
    steps:
    - uses: actions/checkout@v3.5.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3.1.3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Preserve the scientific APIs and model format used by this release.
        python -m pip install . pytest pytest-mock coverage "setuptools<81" "numpy==1.26.4" "pandas==2.2.3" "scipy==1.10.1" "spatialdata==0.4.0" "dask==2024.11.2" "xarray==2024.11.0" "pyarrow==17.0.0" "decoupler==1.7.0" "sparse==0.15.5" "xgboost==2.0.3" "scikit-learn==1.5.2" "tensorly==0.8.1" "statsmodels==0.14.4" "fsspec==2024.10.0" "s3fs==2024.10.0"
    - name: Lint & test coverage
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10' }}
      run: |
        pip install flake8 pytest
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        pip install coverage
        coverage run --source=bento -m pytest tests unit_tests --basetemp="${{ runner.temp }}/pytest"
        coverage report --fail-under=90
    - name: Upload Coverage to Codecov
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10' }}
      uses: codecov/codecov-action@v1
      with:
        fail_ci_if_error: true 
